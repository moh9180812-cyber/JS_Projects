<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task #02</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      form {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        border-radius: 10px;
        background-color: #ddd;
      }
      form input {
        padding: 10px;
        margin-bottom: 15px;
        min-width: 200px;
        border: none;
        border-radius: 10px;
      }
      form select {
        padding: 10px;
        min-width: 200px;
        border: none;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <form action="">
      <input type="text">
      <input type="email">
      <input type="password">
      <select>
        <option value="one">One</option>
        <option value="two">Two</option>
        <option value="three">Three</option>
        <option value="four">Four</option>
        <option value="five">Five</option>
      </select>
    </form>
    <script src="main.js"></script>
  </body>
</html>
